<!DOCTYPE html>

<html>

<head>
    <style>
        body {
            background-color: rgb(129, 168, 168);
            text-align: center;
        }

        div {
            padding: 10px;
        }

        h2 {
            font-size: 100px;
        }

        label {
            display: inline-block;
            width: 200px;
            text-align: right;
        }

        .loginform {
            display: flex;
            justify-content: left;
            align-items: left;
            font-size: 25px;
        }

        .divmargin {
            margin-bottom: 10px;
        }

        .sub input {
            padding-left: 10px;
            display: inline-block;

        }

        .set,
        .sub {
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>

<body>
    <h2>JOB PORTAL</h2>

    <div class="loginform">
        <form action="secondForm.html" target="_blank" method="get">

            <div>
                <label for="email:">Username/Email:</label>
                <input type="text" id="email" name="email" required>
            </div>

            <div class="divmargin">
                <label for="password">Password:</label>
                <input type="password" id="Password" name="password" required>
            </div>
            <div class="sub">
                <input type="submit" value="submit">
            </div>
            <div class="set">
                <input type="reset" value="reset">
            </div>
        </form>
    </div>

</body>

</html>
